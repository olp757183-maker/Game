<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Store — Classic Games</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="./index.html" class="brand-logo">
        <span class="brand-icon">🎮</span>
        <span data-i18n="brandTitle">Classic Games</span>
      </a>

      <button id="mobile-menu-toggle" class="mobile-menu-btn icon-btn" aria-label="Toggle navigation" title="Menu">☰</button>

      <nav class="nav-links" id="site-nav-links">
        <a href="./index.html" class="nav-link" data-i18n="navHome">الرئيسية</a>
        <a href="./lobby.html" class="nav-link" data-i18n="navLobby">صالة الألعاب</a>
        <a href="./store.html" class="nav-link active" data-i18n="navStore">المتجر</a>
        <a href="./profile.html" class="nav-link" data-i18n="navProfile">الملف الشخصي</a>
        <a href="./settings.html" class="nav-link" data-i18n="navSettings">الإعدادات</a>
      </nav>

      <div class="header-actions">
        <a href="./store.html" class="icon-btn active" title="المتجر" aria-label="المتجر" id="header-store-btn" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">🛍️</a>
        <button id="theme-toggle-btn" class="icon-btn" title="Toggle Theme">☀️</button>
        <button id="sound-toggle-btn" class="icon-btn" title="Toggle Sound">🔊</button>
        <button id="lang-toggle-btn" class="btn btn-sm btn-outline">English</button>
        <div id="header-user-actions" style="display: flex; gap: 0.5rem;"></div>
      </div>
    </div>
  </header>

  <!-- Empty Store Main Area -->
  <main class="store-container" style="flex: 1; min-height: 60vh;"></main>

  <script type="module">
    import ui from './js/ui.js';
    document.addEventListener('DOMContentLoaded', () => {
      ui.setupGlobalNav();
    });
  </script>
</body>
</html>
