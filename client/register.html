<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Register — Classic Games</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="./index.html" class="brand-logo">
        <span class="brand-icon">🎮</span>
        <span data-i18n="brandTitle">Classic Games</span>
      </a>

      <div class="header-actions">
        <button id="theme-toggle-btn" class="icon-btn" title="Toggle Theme">☀️</button>
        <button id="lang-toggle-btn" class="btn btn-sm btn-outline">English</button>
      </div>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1 data-i18n="registerTitle">إنشاء حساب جديد</h1>
        <p class="auth-subtitle">انضم والعب واحفظ نتائجك وإحصائياتك</p>
      </div>

      <form id="register-form" class="auth-form" novalidate>
        <div class="form-group" id="group-username">
          <label class="form-label" for="username" data-i18n="usernameLabel">اسم المستخدم:</label>
          <input type="text" id="username" class="form-control" minlength="3" maxlength="20" placeholder="HeroPlayer" autocomplete="username" aria-describedby="username-error">
          <div class="field-error" id="username-error" role="alert" aria-live="polite"></div>
        </div>

        <div class="form-group" id="group-email">
          <label class="form-label" for="email" data-i18n="emailLabel">البريد الإلكتروني:</label>
          <input type="email" id="email" class="form-control" placeholder="player@example.com" autocomplete="email" aria-describedby="email-error">
          <div id="email-domain-suggestions" class="email-domain-suggestions" aria-label="النطاق المقترح">
            <span class="suggestions-label">نطاق مقترح:</span>
            <button type="button" class="domain-chip default-chip" data-domain="@gmail.com" title="إكمال إلى @gmail.com">@gmail.com</button>
            <button type="button" class="domain-chip" data-domain="@outlook.com" title="إكمال إلى @outlook.com">@outlook.com</button>
            <button type="button" class="domain-chip" data-domain="@yahoo.com" title="إكمال إلى @yahoo.com">@yahoo.com</button>
            <button type="button" class="domain-chip" data-domain="@hotmail.com" title="إكمال إلى @hotmail.com">@hotmail.com</button>
          </div>
          <div class="field-error" id="email-error" role="alert" aria-live="polite"></div>
        </div>

        <div class="form-group" id="group-password">
          <label class="form-label" for="password" data-i18n="passwordLabel">كلمة المرور:</label>
          <input type="password" id="password" class="form-control" minlength="6" placeholder="••••••••" autocomplete="new-password" aria-describedby="password-error">
          <div class="field-error" id="password-error" role="alert" aria-live="polite"></div>
        </div>

        <div class="form-group" id="group-confirmPassword">
          <label class="form-label" for="confirmPassword" data-i18n="confirmPasswordLabel">تأكيد كلمة المرور:</label>
          <input type="password" id="confirmPassword" class="form-control" minlength="6" placeholder="••••••••" autocomplete="new-password" aria-describedby="confirmPassword-error">
          <div class="field-error" id="confirmPassword-error" role="alert" aria-live="polite"></div>
        </div>

        <!-- Avatar Selection -->
        <div class="form-group">
          <label class="form-label">اختر الأفاتار:</label>
          <div class="avatar-selection">
            <label style="cursor: pointer;"><input type="radio" name="avatar" value="avatar1" checked style="display:none;"><div class="avatar-badge avatar1"></div></label>
            <label style="cursor: pointer;"><input type="radio" name="avatar" value="avatar2" style="display:none;"><div class="avatar-badge avatar2"></div></label>
            <label style="cursor: pointer;"><input type="radio" name="avatar" value="avatar3" style="display:none;"><div class="avatar-badge avatar3"></div></label>
            <label style="cursor: pointer;"><input type="radio" name="avatar" value="avatar4" style="display:none;"><div class="avatar-badge avatar4"></div></label>
            <label style="cursor: pointer;"><input type="radio" name="avatar" value="avatar5" style="display:none;"><div class="avatar-badge avatar5"></div></label>
            <label style="cursor: pointer;"><input type="radio" name="avatar" value="avatar6" style="display:none;"><div class="avatar-badge avatar6"></div></label>
          </div>
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" data-i18n="navRegister">
          إنشاء الحساب
        </button>
      </form>

      <div class="auth-footer">
        <span data-i18n="alreadyHaveAccount">لديك حساب بالفعل؟</span>
        <a href="./login.html" data-i18n="signInLink">سجل الدخول هنا</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 Classic Games Online</p>
  </footer>

  <script type="module" src="./js/auth.js"></script>
</body>
</html>
